[tox]
envlist = {py311,py312}-django{42,50,51,52}

[testenv]
basepython =
    py311: python3.11
deps =
    pytest
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3

commands = python runtests.py

[gh-actions]
python = 
    3.11: py311
    3.12: py312
